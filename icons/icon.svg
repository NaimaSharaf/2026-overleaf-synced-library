<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a4d"/>
      <stop offset="0.55" stop-color="#0b0c2b"/>
      <stop offset="1" stop-color="#1a1038"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6ff"/>
    </linearGradient>
    <clipPath id="tile"><rect x="0" y="0" width="128" height="128" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="128" height="128" fill="url(#bg)"/>

    <!-- stars -->
    <g fill="#ffd166">
      <path d="M104 22 l2.2 5.2 5.2 2.2 -5.2 2.2 -2.2 5.2 -2.2 -5.2 -5.2 -2.2 5.2 -2.2z"/>
      <path d="M24 94 l1.7 4 4 1.7 -4 1.7 -1.7 4 -1.7 -4 -4 -1.7 4 -1.7z"/>
    </g>
    <g fill="#8ff6ff">
      <circle cx="22" cy="30" r="2.4"/>
      <circle cx="108" cy="92" r="2.1"/>
      <circle cx="96" cy="112" r="1.6"/>
      <circle cx="38" cy="16" r="1.5"/>
    </g>
    <g fill="#ff8fd8">
      <circle cx="16" cy="64" r="1.8"/>
      <circle cx="114" cy="54" r="1.5"/>
    </g>

    <!-- card -->
    <rect x="40" y="26" width="48" height="66" rx="8" fill="url(#paper)"/>
    <!-- bookmark -->
    <path d="M70 26 h12 v22 l-6 -5 -6 5z" fill="#ffd166"/>
    <!-- text lines -->
    <g stroke="#5ef2ff" stroke-width="5" stroke-linecap="round">
      <line x1="50" y1="44" x2="62" y2="44"/>
      <line x1="50" y1="58" x2="78" y2="58"/>
      <line x1="50" y1="70" x2="78" y2="70"/>
    </g>
    <line x1="50" y1="82" x2="68" y2="82" stroke="#9aa3c7" stroke-width="5" stroke-linecap="round"/>

    <!-- orbit -->
    <ellipse cx="64" cy="70" rx="50" ry="17" fill="none" stroke="#ff8fd8" stroke-width="4.5"
             transform="rotate(-22 64 70)"/>
  </g>
</svg>
